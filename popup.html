<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px; background: #f8fafc; }
    h2 { font-size: 16px; color: #1e293b; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .logo { width: 24px; height: 24px; background: #2563eb; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 8px; transition: background 0.2s; }
    .btn-dpd { background: #f59e0b; color: white; }
    .btn-dpd:hover { background: #d97706; }
    .btn-idoklad { background: #7c3aed; color: white; }
    .btn-idoklad:hover { background: #6d28d9; }
    .status { font-size: 12px; color: #64748b; margin-top: 8px; text-align: center; }
    .status.success { color: #16a34a; }
    .status.error { color: #dc2626; }
    .divider { border-top: 1px solid #e2e8f0; margin: 12px 0; }
    .section-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px; margin-bottom: 6px; }
    input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.1); }
    label { font-size: 12px; color: #475569; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>
  <h2><span class="logo">P</span> ProfiECU Autofill</h2>

  <div class="section-label">Automaticky z ProfiECU</div>
  <button class="btn btn-dpd" id="fillDpd">🚚 Vyplnit DPD formulář</button>
  <button class="btn btn-idoklad" id="fillIdoklad">📄 Vyplnit iDoklad</button>

  <div class="divider"></div>

  <div class="section-label">Ruční zadání (záloha)</div>
  <label>Jméno</label><input id="name" placeholder="Jan Novák">
  <label>Ulice</label><input id="street" placeholder="Hlavní 15">
  <label>PSČ</label><input id="zip" placeholder="11000">
  <label>Město</label><input id="city" placeholder="Praha">
  <label>Telefon</label><input id="phone" placeholder="777123456">
  <label>E-mail</label><input id="email" placeholder="jan@email.cz">
  <label>Částka</label><input id="amount" placeholder="14500">
  <label>Výrobní číslo</label><input id="productName" placeholder="036906034DF">
  <button class="btn btn-dpd" id="manualDpd" style="margin-top:8px">Vyplnit DPD (ruční data)</button>
  <button class="btn btn-idoklad" id="manualIdoklad">Vyplnit iDoklad (ruční data)</button>

  <div id="statusMsg" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
